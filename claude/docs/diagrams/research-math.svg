<rect x="1162" y="400" width="215.6" height="29" rx="8" fill="#fbeeee" stroke="#c98f8f" stroke-width="1.5"/>
<text x="1172" y="418" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start" xml:space="preserve">KILLED, with the reason</text>
<text x="1052" y="462" font-size="16" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">V0 computed once</text>
<text x="1312" y="462" font-size="16" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">V1 independent code agrees</text>
<text x="1052" y="490" font-size="16" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">V2 adversary + novelty check</text>
<text x="1312" y="490" font-size="16" font-weight="700" fill="#d97757" text-anchor="start" xml:space="preserve">V3 you understood it</text>
<path d="M960,400 L1030,400" fill="none" stroke="#52606d" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="30" y="555" width="930" height="315" rx="16" fill="#f4f5f7" stroke="#9aa5b1" stroke-width="2"/>
<text x="52" y="592" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">Machines, no LLM</text>
<text x="330" y="592" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">agents design and verify code; machines search</text>
<rect x="52" y="615" width="280" height="160" rx="16" fill="#f4f5f7" stroke="#9aa5b1" stroke-width="2"/>
<text x="70" y="649" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">22:00 cron</text>
<text x="70" y="680.75" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start" xml:space="preserve" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">nightly.sh</text>
<text x="70" y="703.7" font-size="17" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">job queue → runner</text>
<text x="70" y="726.65" font-size="17" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">low priority</text>
<rect x="352" y="615" width="280" height="160" rx="16" fill="#f4f5f7" stroke="#9aa5b1" stroke-width="2"/>
<text x="370" y="649" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">Runner</text>
<text x="370" y="680.75" font-size="17" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">cache by code hash</text>
<text x="370" y="703.7" font-size="17" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">checkpoint ≤ 15 min</text>
<text x="370" y="726.65" font-size="17" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">resumable</text>
<rect x="652" y="615" width="286" height="160" rx="16" fill="#f4f5f7" stroke="#9aa5b1" stroke-width="2"/>
<text x="670" y="649" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">06:30 digest</text>
<text x="670" y="680.75" font-size="17" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">script-written,</text>
<text x="670" y="703.7" font-size="17" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">≤ 80 lines,</text>
<text x="670" y="726.65" font-size="17" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">committed</text>
<path d="M332,695 L352,695" fill="none" stroke="#52606d" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M632,695 L652,695" fill="none" stroke="#52606d" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="52" y="810" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start" xml:space="preserve">• hourly watchdog: restart a crash (≤ 6 a day), retry after a usage limit, never restart a stop</text>
<text x="52" y="845" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start" xml:space="preserve">• optional 06:45 literature watch: one headless round → lit/daily/</text>
<path d="M300,490 L300,615" fill="none" stroke="#52606d" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="312" y="545" font-size="17" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve" font-style="italic">manifests</text>
<path d="M938,660 L985,660 L985,200 L960,200" fill="none" stroke="#52606d" stroke-width="2.4" marker-end="url(#arrow)"/>
<g transform="rotate(-90 1006 650)">
<text x="1006" y="650" font-size="17" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve" font-style="italic">read each morning</text>
</g>
