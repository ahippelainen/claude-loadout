<text x="92" y="64" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">You</text>
<text x="48" y="97" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">give a folder + a problem</text>
<text x="48" y="121.3" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">approve the charter</text>
<text x="48" y="145.6" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">answer open questions</text>
<text x="48" y="169.9" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">sign off: tier V3</text>
<rect x="400" y="30" width="560" height="210" rx="16" fill="#eef4fb" stroke="#7b9cc4" stroke-width="2"/>
