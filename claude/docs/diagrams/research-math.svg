<text x="465.2" y="64" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">Orchestrator</text>
<text x="418" y="97" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">with you: an interactive session</text>
<text x="418" y="121.3" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">away: fresh headless rounds, one task each,</text>
<text x="418" y="145.6" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">supervised hourly by a watchdog;</text>
<text x="418" y="169.9" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">reads STATE.md, updates ledgers, commits</text>
<path d="M330,135 L400,135" fill="none" stroke="#52606d" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="1030" y="30" width="540" height="210" rx="16" fill="#f4f5f7" stroke="#9aa5b1" stroke-width="2"/>
<text x="1048" y="64" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">Files are the state</text>
<text x="1048" y="97" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start" xml:space="preserve" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">CHARTER.md  claims tagged [K] [V] [H]</text>
<text x="1048" y="121.3" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start" xml:space="preserve" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">STATE.md    ≤ 150 lines, rewritten</text>
<text x="1048" y="145.6" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start" xml:space="preserve" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">tasks/      one card per task unit</text>
<text x="1048" y="169.9" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start" xml:space="preserve" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">lit/        one distilled note per source</text>
<text x="1048" y="194.2" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start" xml:space="preserve" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">digests/    one summary per night</text>
<path d="M960,135 L1030,135" fill="none" stroke="#52606d" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="30" y="285" width="930" height="225" rx="16" fill="#eef4fb" stroke="#7b9cc4" stroke-width="2" stroke-dasharray="8 6"/>
