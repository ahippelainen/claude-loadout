<text x="1048" y="589" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">For you, before anything is published</text>
<text x="1048" y="622" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">roadmap graph: known → proved here → open</text>
<text x="1048" y="646.3" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">lecture notes from the basics</text>
<text x="1048" y="670.6" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">companion note per headline result,</text>
<text x="1048" y="694.9" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">read by two fresh referees first</text>
<text x="1052" y="755" font-size="18" font-weight="700" fill="#d97757" text-anchor="start" xml:space="preserve">only V3 leaves the repository</text>
<rect x="1052" y="790" width="104" height="44" rx="10" fill="#d9f2d9" stroke="#2e7d32" stroke-width="2"/>
