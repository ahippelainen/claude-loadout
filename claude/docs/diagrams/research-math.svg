<text x="70" y="374" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">Librarian</text>
<text x="70" y="403" font-size="16" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">lit notes,</text>
<text x="70" y="424.6" font-size="16" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">novelty checks</text>
<rect x="232" y="340" width="168" height="150" rx="16" fill="#eef4fb" stroke="#7b9cc4" stroke-width="2"/>
<text x="250" y="374" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">Engineer</text>
<text x="250" y="403" font-size="16" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">code, tests,</text>
<text x="250" y="424.6" font-size="16" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">job manifests</text>
<rect x="412" y="340" width="168" height="150" rx="16" fill="#eef4fb" stroke="#7b9cc4" stroke-width="2"/>
<text x="430" y="374" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">Constructor</text>
<text x="430" y="403" font-size="16" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">proposes</text>
<text x="430" y="424.6" font-size="16" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">arguments</text>
<rect x="592" y="340" width="168" height="150" rx="16" fill="#f3eefb" stroke="#9b85c9" stroke-width="2"/>
<text x="610" y="374" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">Adversary</text>
<text x="610" y="403" font-size="16" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">attacks every</text>
<text x="610" y="424.6" font-size="16" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">claim before V2</text>
<rect x="772" y="340" width="168" height="150" rx="16" fill="#eef4fb" stroke="#7b9cc4" stroke-width="2"/>
